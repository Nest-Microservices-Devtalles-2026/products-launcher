  selector:
    matchLabels:
      app: products-ms
  strategy: {}
  template:
    metadata:
      labels:
        app: products-ms
    spec:
      containers:
      - image: us-east4-docker.pkg.dev/tienda-microservices-505922/images-registry/products-ms
        name: products-ms
        env:
        - name: PORT
          value: "3001"
        - name: DATABASE_URL
          value: "file:./dev.db"
        - name: NATS_SERVERS
          value: "nats://nats:4222"
        resources: {}
status: {}
