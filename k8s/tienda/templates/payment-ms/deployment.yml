apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: payment-ms
  name: payment-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-ms
  strategy: {}
  template:
    metadata:
      labels:
        app: payment-ms
    spec:
      containers:
      - image: us-east4-docker.pkg.dev/tienda-microservices-505922/images-registry/payments-ms
        name: payments-ms
        env:
        - name: PORT
          value: "3003"
        - name: NATS_SERVERS
          value: "nats://nats:4222"
        - name: STRIPE_SUCCESS_URL
          value: "http://localhost:3003/payments/success"
        - name: STRIPE_CANCEL_URL
          value: "http://localhost:3003/payments/cancel"
        - name: STRIPE_SECRET
          valueFrom:
            secretKeyRef:
              name: payment-secrets
              key: stripe_secret
        - name: ENDPOINT_SECRET_OFFICIAL
          valueFrom:
            secretKeyRef:
              name: payment-secrets
              key: endpoint_secret_official
        - name: ENDPOINT_SECRET_TESTING
          valueFrom:
            secretKeyRef:
              name: payment-secrets
              key: endpoint_secret_testing
        resources: {}
status: {}
