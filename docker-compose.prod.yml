
services:
  nats-servers:
    image: nats

  # order-db:
  #   container_name: orders_database
  #   image: postgres:16.2
  #   restart: always
  #   volumes:
  #     - ./orders-ms/postgres:/var/lib/postgresql/data
  #   ports:
  #     - 5432:5432
  #   environment:
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=123456
  #     - POSTGRES_DB=ordersdb

  client-gateway:
    image: client-gateway-pro
    build: 
      context: ./client-gateway #proceso de contruccion de la imagen esta en el client-gateway
      dockerfile: dockerfile.prod    
    ports:
      - "${CLIENT_GATEWAY_PORT}:${CLIENT_GATEWAY_PORT}"
    environment:
      - PORT=3000
      - NATS_SERVERS=nats://nats-servers:4222
  
  products-ms:
    image: products-ms-prod
    container_name: products-ms
    build: 
      context: ./products-ms
      dockerfile: dockerfile.prod
      args:
        - PORT=3001
        - NATS_SERVERS=nats://nats-servers:4222
        - DATABASE_URL=file:./dev.db
    environment:
      - PORT=3001
      - NATS_SERVERS=nats://nats-servers:4222
      - DATABASE_URL=file:./dev.db

  orders-ms:
    image: orders-ms-prod
    container_name: orders-ms
    build:   
      context: ./orders-ms
      dockerfile: dockerfile.prod
      args:
        - PORT=3002
        - NATS_SERVERS=nats://nats-servers:4222
        - DATABASE_URL=${ORDERS_DATABASE_URL}
    environment:
      - PORT=3002
      - NATS_SERVERS=nats://nats-servers:4222
      - DATABASE_URL=${ORDERS_DATABASE_URL}
  
  payments-ms:
    image: payments-ms-prod
    container_name: payments-ms
    build: 
      context: ./payments-ms
      dockerfile: dockerfile.prod
      args:
        - PORT=${PAYMENTS_MS_PORT}
        - NATS_SERVERS=nats://nats-servers:4222
        - STRIPE_SECRET=${STRIPE_SECRET}
        - ENDPOINT_SECRET_TESTING=${ENDPOINT_SECRET_TESTING}
        - ENDPOINT_SECRET_OFFICIAL=${ENDPOINT_SECRET_OFFICIAL}
        - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL}
        - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL}

    # al utilizar port en la definicion del servicio exponemos un puerto fuera de la red del contenedor con un puerto dentro del contenedor
    # la idea es que en produccion todos los servicios sean inaccessible con excepcion del client-gateway (ya que este es la puerta de entrada) y payment-ms (por el webhook) 
    ports:
      - "${PAYMENTS_MS_PORT}:${PAYMENTS_MS_PORT}"
    environment:
      - PORT=${PAYMENTS_MS_PORT}
      - NATS_SERVERS=nats://nats-servers:4222
      - STRIPE_SECRET=${STRIPE_SECRET}
      - ENDPOINT_SECRET_TESTING=${ENDPOINT_SECRET_TESTING}
      - ENDPOINT_SECRET_OFFICIAL=${ENDPOINT_SECRET_OFFICIAL}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL}


  # Nota IMPORTANTE
  # durante el build de construccion de la imagen 
  # Docker no tiene acceso a las variables definidas en la seccion
  # environment del docker-compose.prod.yml ya que environment solo se 
  # aplica al ejecutar el contenedor (runtime), no al construirlo 
  # (build time).
  # SOLUCION
  # Pasarle args al dockerfile.prod de auth-ms
  auth-ms:
    image: auth-ms-prod
    build:
      context: ./auth-ms
      dockerfile: dockerfile.prod
      args:
        - PORT=3004
        - NATS_SERVERS=nats://nats-servers:4222
        - DATABASE_URL=${AUTH_DATABASE_URL}
        - JWT_SECRET=${JWT_SECRET}
    environment:
      - PORT=3004
      - NATS_SERVERS=nats://nats-servers:4222
      - DATABASE_URL=${AUTH_DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}

